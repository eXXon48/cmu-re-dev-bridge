name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (ES5 page script)
        run: node --check pkg/payload/ui/bridge.js && node test/key.test.js

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RVP_STORE_REV: 79eb801c06332303bc01f40a60150ce8a98c96fa
    steps:
      - uses: actions/checkout@v4

      - name: Checkout store (rvp-pack source)
        uses: actions/checkout@v4
        with:
          repository: eXXon48/cmu-re-store
          ref: ${{ env.RVP_STORE_REV }}
          token: ${{ secrets.STORE_READ_TOKEN }}
          path: store
          persist-credentials: false

      - name: Build rvp-pack
        working-directory: store
        run: |
          rustup toolchain install
          cargo build --release --offline --bin rvp-pack

      - name: Pack dev bridge package
        run: |
          sh tools/mkpkg.sh "${GITHUB_REF_NAME#v}" store/target/release/rvp-pack "cmu-re-dev-bridge-${GITHUB_REF_NAME}.rvp"
          sha256sum "cmu-re-dev-bridge-${GITHUB_REF_NAME}.rvp" | tee "cmu-re-dev-bridge-${GITHUB_REF_NAME}.rvp.sha256"

      - name: Attach package to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cmu-re-dev-bridge-${{ github.ref_name }}.rvp
            cmu-re-dev-bridge-${{ github.ref_name }}.rvp.sha256
